dmkclub_api_delete_member:
    path: '/members/{id}.{_format}'
    methods: [DELETE]
    defaults:
        _controller: 'DMKClub\Bundle\MemberBundle\Controller\Api\Rest\MemberController::deleteAction'
        _format: json
    requirements:
        id: \d+
        _format: json

dmkclub_api_delete_memberfee:
    path: '/memberfees/{id}.{_format}'
    methods: [DELETE]
    defaults:
        _controller: 'DMKClub\Bundle\MemberBundle\Controller\Api\Rest\MemberFeeController::deleteAction'
        _format: json
    requirements:
        id: \d+
        _format: json

dmkclub_api_delete_memberfeediscount:
    path: '/memberfeediscounts/{id}.{_format}'
    methods: [DELETE]
    defaults:
        _controller: 'DMKClub\Bundle\MemberBundle\Controller\Api\Rest\MemberFeeDiscountController::deleteAction'
